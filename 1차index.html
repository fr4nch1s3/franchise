<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사내 메신저 로그 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0a1020; --panel:#0f1830; --panel2:#142142; --line:#25396b;
  --text:#d7e2f5; --muted:#7f92b3; --blue:#6ea8ff; --blue2:#9cc4ff; --bubble:#1a2b55;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 1px 1px,rgba(156,196,255,.14) 1.2px,transparent 0) 0 0/22px 22px,var(--bg);color:var(--text);font-family:"Gowun Dodum","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55}
.app{height:100%;max-width:860px;margin:0 auto;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line)}
header{padding:14px 18px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#1d4ed8,#3b82f6);display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.ttl b{display:block;font-size:16px}
.ttl b::after{content:" ✦";color:var(--blue2);font-size:12px}
.ttl span{font-size:12px;color:var(--muted)}
.status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block}
.bar{padding:12px 18px;border-top:1px solid var(--line);background:var(--panel2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar label{font-size:13px;color:var(--muted)}
input[type=text]{flex:1;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:11px 18px;font:inherit;font-size:16px;letter-spacing:.5px}
input[type=text]::placeholder{color:var(--muted);letter-spacing:0}
input[type=text]:focus{outline:2px solid var(--blue);outline-offset:0}
button{background:var(--blue);color:#0b1430;transition:.15s;border:0;border-radius:999px;padding:11px 22px;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#8fbaff}
.hints{width:100%;display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.chip{background:transparent;border:1px solid var(--line);color:var(--blue2);padding:3px 10px;border-radius:999px;font-weight:500;font-size:12px}
.chip:hover{background:var(--bubble)}
#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:14px;white-space:pre-line}
.sys{align-self:center;font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:4px 14px;border-radius:999px;text-align:center}
.msg{display:flex;gap:10px;max-width:88%;animation:in .45s ease both}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.body{min-width:0}
.meta{display:flex;gap:8px;align-items:baseline;margin-bottom:3px}
.meta b{font-size:13px}
.meta em{font-style:normal;font-size:11px;color:var(--muted)}
.meta .dept{font-size:11px;color:#8da3d1}
.bub{background:var(--bubble);border:1.5px solid var(--line);padding:10px 16px;border-radius:6px 20px 20px 20px;white-space:pre-wrap;word-break:break-word}
@keyframes in{from{opacity:0}to{opacity:1}}
footer{padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--panel2);display:flex;justify-content:space-between;gap:8px}
@media(min-width:900px){.app{height:calc(100% - 32px);margin:16px auto;border:1px solid var(--line);border-radius:28px;overflow:hidden}}
@media(max-width:520px){.msg{max-width:100%}.status{display:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" id="logo">N</div>
    <div class="ttl"><b id="company"></b><span id="channel"></span></div>
    <div class="status"><i></i>로그 열람 전용</div>
  </header>
  <main id="log"><div class="empty">아래 입력창에 날짜를 입력한 뒤 전송하세요.</div></main>
  <form class="bar" id="form" autocomplete="off">
    <div class="hints" id="hints"></div>
    <input type="text" id="d" inputmode="numeric" maxlength="8" placeholder="메시지를 입력하세요." aria-label="날짜 입력">
    <button type="submit">전송</button>
  </form>
  <footer><span id="count">-</span><span>CONFIDENTIAL · 사내 전용</span></footer>
</div>

<script>
/* =====================================================
   ✏️ 여기만 수정하세요 (내용 편집 영역)
   ===================================================== */

// 1) 화면 기본 설정
const CONFIG = {
  company: "Franchise Company",     // 상단 제목
  channel: "# 인디 게임 팀",   // 채널 이름
  logoLetter: "F",
  logoImg: "img/logo.jpg",                       // 로고 이미지 경로 (예: "images/logo.png"). 비우면 위의 글자가 표시됩니다.                   // 로고 글자
  showDateHints: false,               // 기록 있는 날짜 버튼 표시 여부 (false면 숨김)
  noLogText: "해당 날짜에는 기록된 대화가 없습니다.",
  baseDelay: 1200,                   // 메시지 사이 기본 간격 (밀리초, 1000 = 1초)
  perChar: 50                        // 글자 수에 따라 추가되는 간격 (글자당 밀리초)
};

// 2) 캐릭터: 아이디 → 이름 / 부서 / 색상 / 프로필 이미지
//    img 에 이미지 경로를 넣으면 프로필 사진으로 표시됩니다. (예: img: "images/seo.png")
//    비워두거나 파일을 찾지 못하면 이름 첫 글자가 표시됩니다.
const CHARACTERS = {
  seo:  { name: "서정", dept: "영업팀", img: "img/서정.jpg", color: "#2563eb" },
  fu:  { name: "후코", dept: "법무팀", img: "img/후코.jpg", color: "#0891b2" },
  her:  { name: "헤르츠", dept: "디자인팀", img: "img/헤르츠.jpg", color: "#7c3aed" },
  yeo:  { name: "여필지", dept: "법무팀", img: "img/여필지.jpg", color: "#0891b2" },
  tsu:  { name: "츠바키", dept: "개발팀", img: "img/츠바키.jpg", color: "#0891b2" }
};

// 3) 날짜별 대화 (날짜는 6자리 YYMMDD 형식: "260329": [ {t:"시간", who:"캐릭터ID", text:"내용"} ])
//    시스템 알림은 { sys:"내용" } 으로 추가하세요.
const LOGS = {
  "261022": [
    { t: "09:02", who: "seo", text: "잠깐 카페 다녀오려구 하는데, 각자 메뉴 말씀해 주세요." },
    { t: "09:04", who: "yeo", text: "아아 한 잔이요." },
    { t: "09:05", who: "yeo", text: "후코 씨 몫은 치즈케이크로." },
    { t: "09:11", who: "fu", text: "네? 내가 애인 줄 아시나." },
    { t: "09:12", who: "tsu", text: "같이 나갈까요." },
    { t: "09:30", who: "her", text: "저는 자바 칩 프라푸치노요. 드리즐 많이." },
    { t: "09:31", who: "tsu", text: "너무 성가신 주문은 하지 마시고." }
  ],
    { t: "09:32", who: "tsu", text: "대충 아아로 통일하죠." }
  ],
  "261023": [
    { t: "18:47", who: "yeo", text: "경쟁 업체에서 미리 저작권 협회에 등록해 둔 걸 형식만 변경해서 출시했던데." },
    { t: "18:48", who: "yeo", text: "연락해 보고 답 없으면 내가 서류 보낼게요." },
    { t: "18:50", who: "fu", text: "같이 진행하셔도 되는데...." },
    { t: "18:51", who: "fu", text: "감사합니다, 하여튼." }
  ],
  "261024": [
    { t: "11:47", who: "her", text: "오늘 점심 같이 먹을래요?" },
    { t: "11:49", who: "seo", text: "츠바키 님이랑 나가서 먹으려구 했는데." },
    { t: "11:50", who: "seo", text: "@츠바키 같이 가두 돼요?" },
    { t: "11:51", who: "tsu", text: "대신 가게는 헤르츠 님이 추천 좀." }
    { t: "11:53", who: "her", text: "그럼 새로 생긴 중식집 가요." }
  ],
};

/* =====================================================
   아래는 동작 코드입니다 (수정 불필요)
   ===================================================== */
const $ = id => document.getElementById(id);
const logEl = $("log");
let timers = [];

$("company").textContent = CONFIG.company;
$("channel").textContent = CONFIG.channel;
$("logo").textContent = CONFIG.logoLetter;
if(CONFIG.logoImg){
  const li = new Image(); li.alt = ""; li.src = CONFIG.logoImg;
  li.onload = ()=>{ $("logo").textContent = ""; $("logo").appendChild(li); };
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}

function showDate(date){
  timers.forEach(clearTimeout); timers = [];
  logEl.innerHTML = "";
  const rows = LOGS[date];
  if(!rows || !rows.length){
    logEl.appendChild(el("div","empty",CONFIG.noLogText));
    $("count").textContent = date + " · 0건";
    return;
  }
  logEl.appendChild(el("div","sys","— " + fmt(date) + " —"));
  $("count").textContent = date + " · " + rows.filter(r=>!r.sys).length + "건";
  let wait = 600;
  rows.forEach(r=>{
    const at = wait;
    wait += CONFIG.baseDelay + (r.text ? r.text.length * CONFIG.perChar : 0);
    timers.push(setTimeout(()=>{
      let node;
      if(r.sys){
        node = el("div","sys",r.sys);
      } else {
        const c = CHARACTERS[r.who] || {name:r.who||"알 수 없음", dept:"", color:"#475569"};
        node = el("div","msg");
        const av = el("div","av",c.name.charAt(0)); av.style.background = c.color;
        if(c.img){
          const im = new Image(); im.alt = c.name; im.src = c.img;
          im.onload = ()=>{ av.textContent = ""; av.appendChild(im); };
        }
        const body = el("div","body");
        const meta = el("div","meta");
        meta.appendChild(el("b","",c.name));
        if(c.dept) meta.appendChild(el("span","dept",c.dept));
        meta.appendChild(el("em","",r.t || ""));
        body.appendChild(meta);
        body.appendChild(el("div","bub",r.text));
        node.appendChild(av); node.appendChild(body);
      }
      logEl.appendChild(node);
      logEl.scrollTop = logEl.scrollHeight;
    }, at));
  });
}

function fmt(k){ return "20" + k.slice(0,2) + "." + k.slice(2,4) + "." + k.slice(4,6); }

$("form").addEventListener("submit", e=>{
  e.preventDefault();
  let v = $("d").value.replace(/\D/g,"");
  if(v.length === 8) v = v.slice(2);
  if(v.length !== 6){
    timers.forEach(clearTimeout); timers = [];
    logEl.innerHTML = "";
    logEl.appendChild(el("div","empty","날짜는 6자리 숫자로 입력해 주세요.\n(예: 260329)"));
    return;
  }
  showDate(v);
});

if(CONFIG.showDateHints){
  const h = $("hints");
  h.appendChild(el("span","","기록이 있는 날짜:"));
  Object.keys(LOGS).sort().forEach(k=>{
    const b = el("button","chip",k); b.type = "button";
    b.onclick = ()=>{ $("d").value = k; $("d").focus(); };
    h.appendChild(b);
  });
}
</script>
</body>
</html>
